{{define "body"}}
<div class="card shadow-sm bg-white p-4">
  <h3 class="card-title mb-4">Registro Operatori di Sistema</h3>
  <div class="table-responsive">
    <table class="table table-striped table-hover align-middle">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Email</th>
          <th>Cellulare</th>
          <th>Ruolo</th>
          <th>Stato</th>
          <th>Data Creazione</th>
        </tr>
      </thead>
      <tbody>
        {{range .Users}}
        <tr>
          <td>{{.ID}}</td>
          <td>{{.Email}}</td>
          <td><code>{{.Cellulare}}</code></td>
          <td><span class="badge bg-secondary">{{.Role}}</span></td>
          <td>
            {{if eq .Attivo "Attivo"}}
              <span class="badge bg-success">Attivo</span>
            {{else}}
              <span class="badge bg-danger">Disabilitato</span>
            {{end}}
          </td>
          <td class="small text-muted">{{.CreatoIl}}</td>
        </tr>
        {{end}}
      </tbody>
    </table>
  </div>
</div>
{{end}}
