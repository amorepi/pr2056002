{{define "body"}}
<div class="row justify-content-center">
  <div class="col-12 col-lg-10">
    <div class="mb-4 pb-2 border-bottom">
      <h1 class="h2 fw-bold text-dark m-0">Anagrafica Utenti</h1>
      <p class="text-muted small m-0 mt-1">Record estratto dal Database PostgreSQL 17</p>
    </div>
    <div class="card border shadow-sm p-0 bg-white overflow-hidden">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th class="ps-3" style="width: 80px;">ID</th>
              <th>Nome Utente</th>
              <th>Email</th>
              <th>Ruolo</th>
              <th class="text-end pe-3" style="width: 150px;">Stato</th>
            </tr>
          </thead>
          <tbody>
            {{range .Users}}
            <tr>
              <td class="ps-3 font-monospace small text-secondary">#{{.ID}}</td>
              <td class="fw-medium text-dark">{{.Username}}</td>
              <td class="text-secondary">{{.Email}}</td>
              <td><span class="badge text-bg-light border px-2 py-1">{{.Role}}</span></td>
              <td class="text-end pe-3">
                <span class="badge text-bg-success-subtle text-success-emphasis rounded-pill px-2">Attivo</span>
              </td>
            </tr>
            {{else}}
            <tr>
              <td colspan="5" class="text-center py-4 text-muted italic">
                Nessun utente censito nel database.
              </td>
            </tr>
            {{end}}
          </tbody>
        </table>
      </div>
    </div>

  </div>
</div>
{{end}}
