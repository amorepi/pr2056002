{{define "layout"}}
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.ProjectName}} - {{.Version}}</title>
  <!-- Bootstrap 5 CSS Standard da CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">
  <!-- Header Fisso Standard Condiviso -->
  <nav class="navbar navbar-expand-lg bg-white  border-bottom shadow-sm py-2 sticky-top">
    <div class="container-fluid">
      <a href="/" class="navbar-brand m-0 p-0">
        <img src="{{.LogoUrl}}" alt="Logo" class="d-inline-block align-text-top" style="height: 40px;">
      </a>
      
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContenuto">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarContenuto">

        <!-- Menu di Sinistra: Controllato dallo stato di Autenticazione dell'utente -->
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          {{if .Autenticato}}
            <li class="nav-item">
              <a class="nav-link fw-bold" href="/dashboard">Dashboard</a>
            </li>
          {{end}}
        </ul>

        <!-- Menu di Destra: Dropdown unificato associato alla foto dell'utente/Avatar -->
        <ul class="navbar-nav ms-auto align-items-center">
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="navbarDropdownUtente" role="button" data-bs-toggle="dropdown" aria-expanded="false">
              <!-- La foto o l'avatar dell'operatore -->
              <img src="{{.AvatarUrl}}" alt="Avatar" class="rounded-circle bg-white" style="width: 32px; height: 32px; object-fit: cover;">
              <span class="ms-2 text-dark small">
                {{if .Autenticato}}{{.UserName}}{{else}}Anonimo{{end}}
              </span
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Innesto Dinamico del Corpo della Pagina -->
  <div class="container py-5">
    {{template "body" .}}
  </div>

  <!-- Bootstrap 5 JS Bundle da CDN (Necessario per il corretto funzionamento del Dropdown) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
{{end}}
