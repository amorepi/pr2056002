<!-- html/templates/layout.html -->
{{define "layout"}}
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progetto {{.ProjectName}}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">
  
  <!-- HEADER FIXED TOP A TRE COLONNE (Stile React Header Component) -->
  <header class="navbar fixed-top bg-white border-bottom shadow-sm py-2">
    <div class="container-fluid d-flex align-items-center justify-content-between">
      
      <!-- Colonna Sinistra: Logo e Navigazione -->
      <div class="d-flex align-items-center gap-3">
        <a href="/" class="navbar-brand m-0 p-0">
          <img src="{{.LogoUrl}}" alt="Logo" class="d-inline-block align-text-top" style="height: 36px;">
        </a>
        <a href="/" class="nav-link text-dark fw-medium">Home</a>
        <a href="/dashboard" class="nav-link text-dark fw-medium">Dashboard</a>
      </div>

      <!-- Colonna Centrale: Versione ereditata centralmente -->
      <div class="text-center">
        <span class="badge text-bg-secondary font-monospace px-2 py-1">{{.Version}}</span>
      </div>
      
      <!-- Colonna Destra: Stato Amministratore -->
      <div class="d-flex align-items-center gap-3">
        <div class="position-relative" title="{{.UserName}}" style="width: 36px; height: 36px;">
          <img src="{{.AvatarUrl}}" alt="User Avatar" class="img-fluid rounded-circle border w-100 h-100 object-fit-cover">
        </div>
        <a href="/logout" class="btn btn-outline-danger btn-sm px-3">Esci</a>
      </div>

    </div>
  </header>

  <!-- CORPO CENTRALE DINAMICO INIETTATO DA GO (Il corpo del template) -->
  <main class="container-fluid pt-5 mt-5">
    {{template "body" .}}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
{{end}}
