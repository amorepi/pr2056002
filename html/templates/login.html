{{define "body"}}
<div class="row justify-content-center mt-5">
  <div class="col-md-6 col-lg-4">
    <div class="card shadow-sm bg-white p-4">
      <h3 class="card-title text-center mb-4">Accedi al Sistema</h3>
      
      <form action="/login" method="POST">
        <div class="mb-3">
          <label for="username" class="form-label text-muted small fw-bold">Username</label>
          <input type="text" class="form-control bg-white" id="username" name="username" required autocomplete="off">
        </div>
        
        <div class="mb-4">
          <label for="password" class="form-label text-muted small fw-bold">Password</label>
          <div class="input-group">
            <input type="password" class="form-control bg-white" id="password" name="password" required>
            <button class="btn btn-outline-secondary font-monospace" type="button" id="btnTogglePassword">Mostra</button>
          </div>
        </div>
        
        <button type="submit" class="btn btn-primary w-100 fw-bold py-2">ENTRA</button>
      </form>
      
      <div class="mt-4 text-center small text-muted">
        Non hai un account? <a href="/signup" class="text-primary text-decoration-none">Registrati qui (Signup)</a>
      </div>
    </div>
  </div>
</div>

<script>
  document.getElementById('btnTogglePassword').addEventListener('click', function() {
    const passwordInput = document.getElementById('password');
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      this.textContent = 'Nascondi';
    } else {
      passwordInput.type = 'password';
      this.textContent = 'Mostra';
    }
  });
</script>
{{end}}
