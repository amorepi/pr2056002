<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; padding: 20px; color: #212529; max-width: 700px; margin: 0 auto; background-color: #ffffff; border: 1px solid #dee2e6; border-radius: 6px;">
  
  <!-- Intestazione Uniformata e Pulita: Senza Icone Grafiche -->
  <div style="border-bottom: 2px solid #dc3545; padding-bottom: 12px; margin-bottom: 20px;">
    <h2 style="color: #dc3545; margin: 0; font-size: 22px; font-weight: 700;">
      Allerta Eccezione Critica 500
    </h2>
  </div>
  
  <!-- Tabella Dati di Contesto -->
  <table style="width: 100%; border-collapse: collapse; margin-bottom: 25px; font-size: 14px;">
    <tr>
      <td style="padding: 6px 0; font-weight: bold; color: #6c757d; width: 160px; vertical-align: top;">Progetto Applicativo:</td>
      <td style="padding: 6px 0; color: #212529; font-weight: 600;">{{.ProjectName}}</td>
    </tr>
    <tr>
      <td style="padding: 6px 0; font-weight: bold; color: #6c757d; vertical-align: top;">Rotta del Crash:</td>
      <td style="padding: 6px 0; font-family: monospace; color: #ba8b00; font-weight: 600; background-color: #fff3cd; padding: 2px 6px; border-radius: 4px;">{{.Path}}</td>
    </tr>
    <tr>
      <td style="padding: 6px 0; font-weight: bold; color: #6c757d; vertical-align: top;">Messaggio Errore:</td>
      <td style="padding: 6px 0; color: #dc3545; font-weight: 600;">{{.ErrorMessage}}</td>
    </tr>
  </table>
  
  <!-- Box Terminale Privato per lo Stack Trace -->
  <h3 style="font-size: 15px; color: #495057; margin-bottom: 10px; font-weight: 600;">Dettaglio Stack Trace Amministratore:</h3>
  <pre style="background-color: #1e1e1e; color: #4af626; padding: 15px; border-radius: 5px; font-family: 'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace; font-size: 12px; line-height: 1.5; overflow: auto; max-height: 450px; margin: 0; white-space: pre-wrap; word-break: break-all;">{{.StackTrace}}</pre>
  
  <!-- Piè di pagina -->
  <div style="margin-top: 30px; padding-top: 15px; border-top: 1px solid #dee2e6; text-align: center;">
    <p style="margin: 0; font-size: 12px; color: #6c757d;">Messaggio di diagnostica automatica generato dal server VPS.</p>
  </div>
</div>
