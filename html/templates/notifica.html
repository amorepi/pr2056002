{{define "body"}}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6 text-center">
    <!-- Pannello della Notifica in stile Card -->
    <div class="p-5 bg-white border rounded shadow-sm">
      <!-- Icona di Spunta Verde Bootstrap -->
      <div class="text-success mb-4">
        <svg xmlns="http://w3.org" width="64" height="64" fill="currentColor" class="bi bi-check-circle-fill d-inline-block" viewBox="0 0 16 16">
          <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0m-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
        </svg>
      </div>
      
      <!-- Messaggio Dinamico -->
      <h2 class="fw-bold text-dark mb-3">{{.Title}}</h2>
      <p class="text-secondary mb-4">{{.Subtitle}}</p>
    </div>

  </div>
</div>
{{end}}
