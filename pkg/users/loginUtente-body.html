{{define "body"}}
<div class="row justify-content-center mt-5">
  <div class="col-12 col-md-8 col-lg-6 text-center">
    <div class="p-5 bg-white border rounded shadow-sm">

      <h2 class="card-title text-center mb-4">Accedi</h2>

      {{if .Errore}}
        <div class="alert alert-danger py-2" role="alert">
          {{.Errore}}
        </div>
      {{end}}

      {{if .Messaggio}}
        <div class="alert alert-success" role="alert">
          {{.Messaggio}}
        </div>
      {{end}}

      <form action="/login" method="POST">
        <div class="mb-3 text-start">
          <label for="emailcell" class="form-label d-block text-start">Email o Cellulare</label>
          <input type="text" id="emailcell" name="emailcell" class="form-control" required autofocus>
        </div>

        <div class="mb-4 text-start">
          <label for="password" class="form-label d-block text-start">Password</label>
          <div class="input-group">
            <input type="password" id="password" name="password" class="form-control" required>
            <button class="btn btn-outline-secondary text-dark bg-light d-flex align-items-center justify-content-center" type="button" id="togglePassword" 
                    onclick="const p = document.getElementById('password'); const icon = this.querySelector('i'); if (p.type === 'password') { p.type = 'text'; icon.classList.replace('bi-eye', 'bi-eye-slash'); } else { p.type = 'password'; icon.classList.replace('bi-eye-slash', 'bi-eye'); }">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2">Accedi</button>
      </form>

      <div class="text-center mt-3">
        <small>Non hai un account? <a href="/signup">Registrati</a></small>
      </div>
    </div>
</div>
{{end}}
