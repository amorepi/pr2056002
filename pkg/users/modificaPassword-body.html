{{define "body"}}
<div class="row justify-content-center mt-5">
  <div class="col-md-6 col-lg-4">
    <div class="card shadow-sm bg-white p-4">
      <div class="text-center mb-4">
          <h3 class="fw-bold">Modifica Password</h3>
          <p class="text-muted small">Inserisci la tua nuova password d'accesso</p>
      </div>

      <!-- Messaggio di errore gestito elegantemente lato server via Go Template -->
      {{if .Errore}}
      <div class="alert alert-danger py-2 text-center small" role="alert">
          {{.Errore}}
      </div>
      {{end}}

      <form action="/modificaPassword" method="POST">
          
          <!-- Campo Nuova Password -->
          <div class="mb-3">
              <label for="password1" class="form-label small fw-semibold">Nuova Password</label>
              <input type="password" id="password1" name="password1" class="form-control" autocomplete="password1" required>
          </div>

          <!-- Campo Ripeti Password -->
          <div class="mb-4">
              <label for="password2" class="form-label small fw-semibold">Ripeti Password</label>
              <input type="password" id="password2" name="password2" class="form-control" autocomplete="password2" required>
          </div>

          <!-- Pulsante di Invio -->
          <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary fw-medium">Salva e Esci</button>
          </div>
          
      </form>
    </div>
  </div>
</div>
{{end}}
